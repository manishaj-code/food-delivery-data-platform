# Local development environment: pipeline container, local PostgreSQL warehouse (+ Airflow
# metadata database), and Airflow 3.
# Credentials come from the untracked .env (copy .env.example); nothing secret lives here.
#
#   docker compose build                       # both images
#   docker compose up -d                       # postgres + airflow-init + airflow (UI :8080)
#   docker compose run --rm pipeline --help    # the pipeline CLI (python -m src.cli)
#
# AWS mode: add -f docker-compose.aws.yml (read-only ~/.aws mount), see that file.
name: food-delivery

x-project-env: &project-env
  LOCAL_LAKE_PATH: /opt/project/lake
  SOURCE_DATA_PATH: /opt/project/data/generated

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: food-delivery-airflow:dev
  # Same uid as the pipeline image's app user, so both containers can write the mounted
  # lake/ and data/ folders; gid 0 lets any uid use the Airflow image's files.
  user: "${AIRFLOW_UID:-1000}:0"
  env_file:
    - path: .env
      required: false
  environment:
    <<: *project-env
    PYTHONPATH: /opt/project
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # One task at a time: Spark and Airflow share an 8 GB host (TR-03).
    AIRFLOW__CORE__PARALLELISM: "1"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@postgres:5432/airflow"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}"
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}"
    AIRFLOW__API__SECRET_KEY: "${AIRFLOW_API_SECRET_KEY:?Set AIRFLOW_API_SECRET_KEY in .env}"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USERNAME:-admin}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
  volumes:
    - .:/opt/project
    - ./airflow/logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # Run-only CLI container (ENTRYPOINT python -m src.cli): `docker compose run --rm pipeline
  # <command>`. `docker compose up` just prints the CLI help and exits. The dev target adds
  # pytest/ruff; the repository is bind-mounted so code changes need no rebuild.
  pipeline:
    build:
      context: .
      target: dev
    image: food-delivery-pipeline:dev
    env_file:
      - path: .env
        required: false
    environment:
      <<: *project-env
    volumes:
      - .:/opt/project
    working_dir: /opt/project
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy

  # Local stand-in for Redshift (WAREHOUSE_TYPE=postgres). The official image creates
  # the database and user from these variables on first start; the Airflow metadata
  # database is added by airflow-init.
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_DB: ${REDSHIFT_DATABASE:-warehouse}
      POSTGRES_USER: ${REDSHIFT_USER:-warehouse_user}
      POSTGRES_PASSWORD: ${REDSHIFT_PASSWORD:?Set REDSHIFT_PASSWORD in .env (copy .env.example)}
    ports:
      # localhost only, for SQL clients; 5433 avoids clashing with a locally installed PostgreSQL
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped  # Airflow's metadata lives here; come back after a Docker restart

  # One-off: create the Airflow metadata database (if missing) and migrate it.
  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "python /opt/project/docker/airflow/bootstrap.py db && airflow db migrate"]
    restart: "no"

  # All Airflow 3 components in one container (scheduler, API server/UI, DAG processor,
  # triggerer) to fit the 8 GB host; tasks and Spark run here too.
  airflow:
    <<: *airflow-common
    command: ["bash", "-c", "python /opt/project/docker/airflow/bootstrap.py auth && exec airflow standalone"]
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    mem_limit: 3g
    restart: unless-stopped

volumes:
  postgres-data:
