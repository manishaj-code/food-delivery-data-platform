# Local development environment: pipeline container + local PostgreSQL warehouse.
# Airflow is added in Phase 9; finalised in Phase 10.
# Credentials come from the untracked .env (copy .env.example); nothing secret lives here.
name: food-delivery

services:
  pipeline:
    build: .
    image: food-delivery-pipeline:dev
    env_file:
      - path: .env
        required: false
    environment:
      LOCAL_LAKE_PATH: /opt/project/lake
      SOURCE_DATA_PATH: /opt/project/data/generated
    volumes:
      - .:/opt/project
    working_dir: /opt/project
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy

  # Local stand-in for Redshift (WAREHOUSE_TYPE=postgres). The official image creates
  # the database and user from these variables on first start.
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_DB: ${REDSHIFT_DATABASE:-warehouse}
      POSTGRES_USER: ${REDSHIFT_USER:-warehouse_user}
      POSTGRES_PASSWORD: ${REDSHIFT_PASSWORD:?Set REDSHIFT_PASSWORD in .env (copy .env.example)}
    ports:
      # localhost only, for SQL clients; 5433 avoids clashing with a locally installed PostgreSQL
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

volumes:
  postgres-data:
