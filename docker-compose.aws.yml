# AWS-mode override: gives the pipeline and Airflow containers read-only access to the
# host's AWS CLI configuration. Credentials are mounted at runtime, never copied into an
# image or written to .env (spec 11 §10).
#
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml run --rm pipeline --help
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d
#
# Switching to AWS is configuration only (NFR-017): in .env set STORAGE_MODE=s3,
# WAREHOUSE_TYPE=redshift, S3_BUCKET, REDSHIFT_* and AWS_PROFILE (a profile in ~/.aws).
# The profile must hold credentials the SDKs can read from the files themselves (access
# keys / temporary session keys, or credential_process); the mount is read-only, so
# `aws sso login` token refreshes inside the containers are not supported.
#
# The files are mounted at /opt/aws and pointed to explicitly, because the Airflow
# container's arbitrary uid has no fixed home directory.

#
# Metrics: METRICS_ENABLED=true and PIPELINE_ENV=<terraform environment> in .env send them
# to CloudWatch (the alarm matches on the Environment dimension); `terraform output -raw
# env_file` prints both.

x-aws: &aws
  environment:
    AWS_CONFIG_FILE: /opt/aws/config
    AWS_SHARED_CREDENTIALS_FILE: /opt/aws/credentials
  volumes:
    - ~/.aws:/opt/aws:ro

services:
  pipeline: *aws
  airflow:
    <<: *aws
    # Optional (spec 12 §1): ship Airflow task logs to the pipeline log group. Uncomment,
    # merge into the environment above (YAML does not merge nested mappings), and set
    # <region>/<account>. Needs logs:CreateLogStream/PutLogEvents/DescribeLogStreams/
    # GetLogEvents on the group (the Terraform pipeline role has them).
    # environment:
    #   AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
    #   AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: aws_default
    #   AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: "cloudwatch://arn:aws:logs:<region>:<account>:log-group:/food-delivery/dev/pipeline"
    #   AIRFLOW_CONN_AWS_DEFAULT: "aws://?region_name=<region>"  # default credential chain
